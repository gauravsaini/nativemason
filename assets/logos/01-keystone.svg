<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad1" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="coreGlow1" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Keystone Gradients -->
    <linearGradient id="keystoneMain" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="keystoneHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Pylon Gradients -->
    <linearGradient id="pylonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="pylonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="facetAccentLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="facetAccentRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="keystoneGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowPlate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container Plate -->
  <rect width="400" height="400" rx="64" fill="url(#bgGrad1)" />
  <rect width="398" height="398" x="1" y="1" rx="63" fill="none" stroke="#334155" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Ambient Light Center Glow -->
  <circle cx="200" cy="190" r="160" fill="url(#coreGlow1)" />

  <!-- Subtle Architectural Alignment Matrix -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="3 6">
    <line x1="200" y1="40" x2="200" y2="360" />
    <line x1="60" y1="200" x2="340" y2="200" />
    <circle cx="200" cy="200" r="110" fill="none" />
    <circle cx="200" cy="200" r="60" fill="none" />
  </g>

  <!-- Corner Precision Reticles -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.35">
    <path d="M 64 80 L 64 64 L 80 64" fill="none" />
    <path d="M 336 80 L 336 64 L 320 64" fill="none" />
    <path d="M 64 320 L 64 336 L 80 336" fill="none" />
    <path d="M 336 320 L 336 336 L 320 336" fill="none" />
  </g>

  <!-- MAIN ABSTRACT EMBLEM -->
  <g filter="url(#shadowPlate)">
    <!-- LEFT STRUCTURAL PYLON (Faceted Architectural Block) -->
    <!-- Base block -->
    <path d="M 96 288 L 140 132 L 176 148 L 142 288 Z" fill="url(#pylonLeft)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <!-- Beveled front face -->
    <path d="M 140 132 L 176 148 L 152 288 L 118 288 Z" fill="url(#pylonLeft)" opacity="0.85" />
    <!-- Glowing inner chamfer edge -->
    <path d="M 140 132 L 176 148" stroke="url(#keystoneHighlight)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 176 148 L 152 288" stroke="url(#facetAccentLeft)" stroke-width="1.5" />

    <!-- RIGHT STRUCTURAL PYLON (Symmetric Counter-Pillar) -->
    <!-- Base block -->
    <path d="M 304 288 L 260 132 L 224 148 L 258 288 Z" fill="url(#pylonRight)" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />
    <!-- Beveled front face -->
    <path d="M 260 132 L 224 148 L 248 288 L 282 288 Z" fill="url(#pylonRight)" opacity="0.95" />
    <!-- Glowing inner chamfer edge -->
    <path d="M 260 132 L 224 148" stroke="url(#keystoneHighlight)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 224 148 L 248 288" stroke="url(#facetAccentRight)" stroke-width="1.5" />

    <!-- THE HORIZONTAL TIE-BEAM (The Bridge Component) -->
    <polygon points="134,228 266,228 256,252 144,252" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <line x1="148" y1="230" x2="252" y2="230" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5" />

    <!-- SUSPENDED KEYSTONE (The Locking Central Jewel / Precision Monolith) -->
    <g filter="url(#keystoneGlow)">
      <!-- Keystone Outer Silhouette -->
      <polygon points="160,86 240,86 226,178 200,196 174,178" fill="url(#keystoneMain)" />

      <!-- Left Facet -->
      <polygon points="160,86 200,86 200,196 174,178" fill="url(#keystoneHighlight)" />

      <!-- Right Facet -->
      <polygon points="200,86 240,86 226,178 200,196" fill="url(#keystoneMain)" opacity="0.85" />

      <!-- Top Bevel Shelf -->
      <polygon points="160,86 240,86 232,96 168,96" fill="#E0F2FE" opacity="0.65" />

      <!-- Center Spine Highlight -->
      <line x1="200" y1="86" x2="200" y2="196" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />

      <!-- Perimeter Sharp Rim -->
      <polygon points="160,86 240,86 226,178 200,196 174,178" fill="none" stroke="#BAE6FD" stroke-width="1.5" />
    </g>

    <!-- CENTRAL COUPLING BEAM (Laser alignment down to arch threshold) -->
    <line x1="200" y1="196" x2="200" y2="280" stroke="url(#beamGradient)" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="200" cy="200" r="3.5" fill="#38BDF8" />
    <circle cx="200" cy="240" r="2.5" fill="#38BDF8" opacity="0.75" />
    <circle cx="200" cy="280" r="3" fill="#818CF8" />

    <!-- SUBTLE GEOMETRIC MONOGRAM OVERLAY ("N" and "M" in the Negative Arch) -->
    <!-- Left arch leg anchor -->
    <circle cx="143" cy="288" r="4" fill="#38BDF8" />
    <!-- Right arch leg anchor -->
    <circle cx="257" cy="288" r="4" fill="#818CF8" />
  </g>

  <!-- Typography: Modern Geometric Wordmark Sub-label -->
  <text x="200" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#94A3B8">NATIVEMASON</text>
  <text x="200" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#38BDF8" opacity="0.8">KEYSTONE ARCH</text>
</svg>

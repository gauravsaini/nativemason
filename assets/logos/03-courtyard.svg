<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad3" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1A1513" />
      <stop offset="60%" stop-color="#0E0B09" />
      <stop offset="100%" stop-color="#050403" />
    </radialGradient>

    <!-- Warm Radiant Ambient Glow -->
    <radialGradient id="coreGlow3" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0E0B09" stop-opacity="0" />
    </radialGradient>

    <!-- Top Solar Faces (Illuminated) -->
    <linearGradient id="solarTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Left Terracotta Faces (Midtone) -->
    <linearGradient id="terracottaLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <!-- Right Shadowed Faces (Deep Ambient) -->
    <linearGradient id="umberRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Central Keystone Prism Special Gradient -->
    <linearGradient id="keystoneAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowPlate3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Container Plate -->
  <rect width="400" height="400" rx="64" fill="url(#bgGrad3)" />
  <rect width="398" height="398" x="1" y="1" rx="63" fill="none" stroke="#78350F" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Light Center Glow -->
  <circle cx="200" cy="186" r="160" fill="url(#coreGlow3)" />

  <!-- Geometric Coordinate Grid -->
  <g opacity="0.15" stroke="#F59E0B" stroke-width="0.75">
    <line x1="200" y1="50" x2="200" y2="330" stroke-dasharray="3 5" />
    <line x1="70" y1="186" x2="330" y2="186" stroke-dasharray="3 5" />
    <circle cx="200" cy="186" r="114" fill="none" stroke-dasharray="3 6" />
    <!-- 60 degree radial guidelines -->
    <line x1="101" y1="129" x2="299" y2="243" stroke-dasharray="2 4" />
    <line x1="101" y1="243" x2="299" y2="129" stroke-dasharray="2 4" />
  </g>

  <!-- Corner Precision Accents -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.4">
    <path d="M 64 80 L 64 64 L 80 64" fill="none" />
    <path d="M 336 80 L 336 64 L 320 64" fill="none" />
    <path d="M 64 320 L 64 336 L 80 336" fill="none" />
    <path d="M 336 320 L 336 336 L 320 336" fill="none" />
  </g>

  <!-- MAIN ABSTRACT EMBLEM: THE MASON MONOLITH (3 Interlocking Prisms forming 'M' / Arch) -->
  <g filter="url(#shadowPlate3)">
    <!-- LEFT PILLAR PRISM -->
    <!-- Top Face -->
    <polygon points="106,140 156,112 196,134 146,162" fill="url(#solarTop)" />
    <!-- Left Face -->
    <polygon points="106,140 146,162 146,268 106,246" fill="url(#terracottaLeft)" />
    <!-- Right / Inner Face -->
    <polygon points="146,162 196,134 196,240 146,268" fill="url(#umberRight)" />
    <!-- Highlighted Crease Line -->
    <line x1="146" y1="162" x2="146" y2="268" stroke="#FED7AA" stroke-width="1.5" stroke-linecap="round" />
    <line x1="106" y1="140" x2="146" y2="162" stroke="#FFFBEB" stroke-width="2" stroke-linecap="round" />

    <!-- RIGHT PILLAR PRISM -->
    <!-- Top Face -->
    <polygon points="204,134 244,112 294,140 254,162" fill="url(#solarTop)" />
    <!-- Left / Inner Face -->
    <polygon points="204,134 254,162 254,268 204,240" fill="url(#terracottaLeft)" opacity="0.8" />
    <!-- Right Face -->
    <polygon points="254,162 294,140 294,246 254,268" fill="url(#umberRight)" />
    <!-- Highlighted Crease Line -->
    <line x1="254" y1="162" x2="254" y2="268" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" />
    <line x1="294" y1="140" x2="254" y2="162" stroke="#FFFBEB" stroke-width="2" stroke-linecap="round" />

    <!-- FLOATING CENTRAL KEYSTONE PRISM (Locks the two pillars into an 'M') -->
    <g filter="url(#glowFilter3)">
      <!-- Top Diamond Facet -->
      <polygon points="200,78 238,98 200,118 162,98" fill="url(#keystoneAmber)" />

      <!-- Left Chamfer Facet -->
      <polygon points="162,98 200,118 200,188 162,168" fill="url(#terracottaLeft)" />

      <!-- Right Chamfer Facet -->
      <polygon points="200,118 238,98 238,168 200,188" fill="url(#umberRight)" />

      <!-- Keystone Bottom Bevel -->
      <polygon points="162,168 200,188 238,168 200,198" fill="#F97316" />

      <!-- Apex Razor Highlights -->
      <line x1="200" y1="78" x2="200" y2="188" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="162" y1="98" x2="200" y2="118" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="200" y1="118" x2="238" y2="98" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- ARCH FOUNDATION / TIE BASE (Negative space creates Romanesque portal) -->
    <!-- Foundation Step Left -->
    <polygon points="106,246 146,268 146,278 106,256" fill="#7C2D12" />
    <!-- Foundation Step Right -->
    <polygon points="254,268 294,246 294,256 254,278" fill="#431407" />

    <!-- Central Optical Archway Cutout Guideline -->
    <path d="M 166 264 Q 200 216 234 264" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
    <circle cx="200" cy="236" r="3.5" fill="#FDE68A" />

    <!-- Corner Structural Vertices -->
    <circle cx="200" cy="78" r="3.5" fill="#FFFBEB" />
    <circle cx="106" cy="140" r="3" fill="#FDE68A" />
    <circle cx="294" cy="140" r="3" fill="#FDE68A" />
    <circle cx="146" cy="268" r="3" fill="#FB923C" />
    <circle cx="254" cy="268" r="3" fill="#FB923C" />
  </g>

  <!-- Typography: Modern Geometric Wordmark Sub-label -->
  <text x="200" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#FED7AA">NATIVEMASON</text>
  <text x="200" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#F59E0B" opacity="0.8">MASON MONOLITH</text>
</svg>

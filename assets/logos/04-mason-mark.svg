<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad4" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#140E26" />
      <stop offset="55%" stop-color="#0A0614" />
      <stop offset="100%" stop-color="#040208" />
    </radialGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="coreGlow4" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A0614" stop-opacity="0" />
    </radialGradient>

    <!-- Wing Facet Gradients -->
    <linearGradient id="violetWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="violetWingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <linearGradient id="fuchsiaLowerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="60%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <linearGradient id="fuchsiaLowerRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="50%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>

    <linearGradient id="prismCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE" />
      <stop offset="40%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowPlate4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Container Plate -->
  <rect width="400" height="400" rx="64" fill="url(#bgGrad4)" />
  <rect width="398" height="398" x="1" y="1" rx="63" fill="none" stroke="#581C87" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Light Center Glow -->
  <circle cx="200" cy="188" r="160" fill="url(#coreGlow4)" />

  <!-- Kinetic Dynamic Vectors & Drafting Compass Rings -->
  <g opacity="0.18" stroke="#A855F7" stroke-width="0.75">
    <line x1="200" y1="46" x2="200" y2="330" stroke-dasharray="3 5" />
    <line x1="60" y1="188" x2="340" y2="188" stroke-dasharray="3 5" />
    <!-- Dynamic Diamond Perimeter -->
    <polygon points="200,60 320,188 200,316 80,188" fill="none" stroke-dasharray="4 6" opacity="0.5" />
    <circle cx="200" cy="188" r="120" fill="none" stroke-dasharray="2 4" />
  </g>

  <!-- Corner Precision Accents -->
  <g stroke="#C084FC" stroke-width="1" opacity="0.4">
    <path d="M 64 80 L 64 64 L 80 64" fill="none" />
    <path d="M 336 80 L 336 64 L 320 64" fill="none" />
    <path d="M 64 320 L 64 336 L 80 336" fill="none" />
    <path d="M 336 320 L 336 336 L 320 336" fill="none" />
  </g>

  <!-- MAIN ABSTRACT EMBLEM: THE KINETIC APEX (Geometric Trowel-Delta / Diamond Glyph) -->
  <g filter="url(#shadowPlate4)">
    <!-- UPPER LEFT SWEPT WING -->
    <polygon points="200,74 104,188 158,188 200,138" fill="url(#violetWingLeft)" />
    <!-- Illuminated Ridge -->
    <line x1="200" y1="74" x2="104" y2="188" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round" />
    <line x1="200" y1="74" x2="200" y2="138" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- UPPER RIGHT SWEPT WING -->
    <polygon points="200,74 296,188 242,188 200,138" fill="url(#violetWingRight)" />
    <!-- Illuminated Ridge -->
    <line x1="200" y1="74" x2="296" y2="188" stroke="#F3E8FF" stroke-width="2.5" stroke-linecap="round" />

    <!-- LOWER LEFT FACET (Trailing Wing & Handle Root Anchor) -->
    <polygon points="104,188 158,188 200,238 200,298" fill="url(#fuchsiaLowerLeft)" />
    <line x1="104" y1="188" x2="200" y2="298" stroke="#6D28D9" stroke-width="1.5" stroke-linecap="round" />

    <!-- LOWER RIGHT FACET -->
    <polygon points="296,188 242,188 200,238 200,298" fill="url(#fuchsiaLowerRight)" />
    <line x1="296" y1="188" x2="200" y2="298" stroke="#BE185D" stroke-width="1.5" stroke-linecap="round" />
    <line x1="200" y1="238" x2="200" y2="298" stroke="#F472B6" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- CENTRAL FLOATING PRISM APERTURE (The Kinetic Core / Precision Crystal) -->
    <g filter="url(#glowFilter4)">
      <!-- Inner Diamond Core -->
      <polygon points="200,148 232,188 200,228 168,188" fill="url(#prismCore)" />
      <!-- Left Facet Shade -->
      <polygon points="200,148 168,188 200,228" fill="#FDF4FF" opacity="0.4" />
      <!-- Core Center Spine -->
      <line x1="200" y1="148" x2="200" y2="228" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Rim Stroke -->
      <polygon points="200,148 232,188 200,228 168,188" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- Transverse Tension Bridges (Negative space connectors) -->
    <line x1="158" y1="188" x2="168" y2="188" stroke="#E9D5FF" stroke-width="2" />
    <line x1="232" y1="188" x2="242" y2="188" stroke="#E9D5FF" stroke-width="2" />

    <!-- Kinetic Terminal Nodes -->
    <circle cx="200" cy="74" r="4" fill="#FFFFFF" />
    <circle cx="104" cy="188" r="3.5" fill="#DDD6FE" />
    <circle cx="296" cy="188" r="3.5" fill="#F3E8FF" />
    <circle cx="200" cy="298" r="4" fill="#EC4899" />
    <circle cx="200" cy="188" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography: Modern Geometric Wordmark Sub-label -->
  <text x="200" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#E9D5FF">NATIVEMASON</text>
  <text x="200" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#C084FC" opacity="0.8">KINETIC APEX</text>
</svg>

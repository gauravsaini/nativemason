<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-labelledby="title-4 desc-4">
  <title id="title-4">NativeMason Logo Option 4: Mason Mark Mobile</title>
  <desc id="desc-4">Dark slate card, glazed teal and forest architectural bricks, mobile layout viewport window, chrome and amber trowel crowned at top.</desc>
  <defs>
    <!-- Dark Tech Canvas -->
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald / Teal Glazed Bricks -->
    <linearGradient id="masonBrickA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="masonBrickB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Chrome & Amber Trowel -->
    <linearGradient id="chromeTrowel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Window Interior Terminal View -->
    <linearGradient id="terminalGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <filter id="glow4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Slate Outer Card -->
  <rect width="400" height="400" rx="44" fill="url(#bg4)" stroke="#1E293B" stroke-width="2" />

  <g filter="url(#glow4)">
    <!-- TROWEL: Centered peeking over wall apex -->
    <g transform="translate(200, 48)">
      <!-- Gooseneck Shank -->
      <path d="M0,38 C-3,26 4,18 6,6 C7,-2 5,-10 5,-18" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
      <!-- Amber Ferrule -->
      <rect x="-1" y="-22" width="12" height="6" rx="2" fill="url(#amberAccent)" />

      <!-- Ebony Handle with Amber Pinstripe -->
      <path d="M2,-22 C0,-32 -2,-48 2,-62 C5,-72 11,-72 14,-62 C18,-48 16,-32 14,-22 Z" fill="#020617" stroke="#334155" stroke-width="1.5" />
      <line x1="8" y1="-56" x2="8" y2="-28" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

      <!-- Centered Masonry Trowel Blade -->
      <path d="M0,-4 L-28,40 C-30,54 -22,72 -4,72 L4,72 C22,72 30,54 28,40 Z" fill="url(#chromeTrowel)" stroke="#64748B" stroke-width="1.2" />
      <line x1="0" y1="-2" x2="0" y2="70" stroke="#FFFFFF" stroke-width="2" />
      <polygon points="0,-4 28,40 20,72 0,72" fill="#000000" opacity="0.12" />

      <!-- Glint at tip -->
      <polygon points="0,-9 2,-4 7,-2 2,0 0,5 -2,0 -7,-2 -2,-4" fill="#FFFFFF" />
    </g>

    <!-- BRICK STRUCTURE -->
    <rect x="42" y="98" width="316" height="248" rx="20" fill="#022C22" stroke="#0D9488" stroke-width="1.5" />

    <!-- Top Coping Lintel -->
    <rect x="36" y="92" width="328" height="18" rx="5" fill="#0D9488" stroke="#2DD4BF" stroke-width="1.5" />
    <line x1="38" y1="94" x2="362" y2="94" stroke="#5EEAD4" stroke-width="2" />

    <!-- Teal Architectural Bricks -->
    <!-- Row 1 -->
    <rect x="46" y="116" width="76" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="126" y="116" width="80" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="210" y="116" width="80" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="294" y="116" width="60" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />

    <!-- Row 2 -->
    <rect x="46" y="154" width="56" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="106" y="154" width="26" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="268" y="154" width="26" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="298" y="154" width="56" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />

    <!-- Row 3 -->
    <rect x="46" y="192" width="40" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="90" y="192" width="42" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="268" y="192" width="42" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="314" y="192" width="40" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />

    <!-- Row 4 -->
    <rect x="46" y="230" width="56" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="106" y="230" width="26" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="268" y="230" width="26" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="298" y="230" width="56" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />

    <!-- Row 5 -->
    <rect x="46" y="268" width="80" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="130" y="268" width="78" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="212" y="268" width="70" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="286" y="268" width="68" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />

    <!-- Row 6 -->
    <rect x="46" y="306" width="50" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="100" y="306" width="96" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />
    <rect x="200" y="306" width="96" height="34" rx="6" fill="url(#masonBrickB)" stroke="#14B8A6" stroke-width="1" />
    <rect x="300" y="306" width="54" height="34" rx="6" fill="url(#masonBrickA)" stroke="#14B8A6" stroke-width="1" />

    <!-- MODERN VIEWPORT WINDOW -->
    <rect x="134" y="146" width="132" height="114" rx="16" fill="#042F2E" stroke="#2DD4BF" stroke-width="3" />
    <rect x="140" y="152" width="120" height="102" rx="12" fill="url(#terminalGlass)" />

    <!-- Mobile Viewport Notch & Status dots -->
    <rect x="175" y="156" width="50" height="4" rx="2" fill="#2DD4BF" opacity="0.8" />

    <!-- Native Layout Panels -->
    <rect x="148" y="168" width="104" height="22" rx="4" fill="#0D9488" opacity="0.4" stroke="#5EEAD4" stroke-width="1" />
    <line x1="156" y1="179" x2="194" y2="179" stroke="#CCFBF1" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="242" cy="179" r="3.5" fill="#F59E0B" />

    <!-- Action Button Rows -->
    <rect x="148" y="196" width="50" height="48" rx="4" fill="#14B8A6" opacity="0.25" stroke="#2DD4BF" stroke-width="1" />
    <rect x="202" y="196" width="50" height="48" rx="4" fill="#14B8A6" opacity="0.25" stroke="#2DD4BF" stroke-width="1" />
    <line x1="156" y1="210" x2="190" y2="210" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" />
    <line x1="156" y1="222" x2="180" y2="222" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="210" y1="210" x2="244" y2="210" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="222" x2="234" y2="222" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Glass Reflection Slash -->
    <polygon points="142,246 182,152 200,152 160,246" fill="#FFFFFF" opacity="0.18" />

    <!-- Glowing Teal Window Sill -->
    <rect x="124" y="260" width="152" height="12" rx="4" fill="#0D9488" stroke="#2DD4BF" stroke-width="1.5" />
    <line x1="126" y1="262" x2="274" y2="262" stroke="#A7F3D0" stroke-width="2" />
  </g>
</svg>

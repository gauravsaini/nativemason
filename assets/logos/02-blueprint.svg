<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad2" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#04201E" />
      <stop offset="60%" stop-color="#021110" />
      <stop offset="100%" stop-color="#010807" />
    </radialGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="coreGlow2" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#021110" stop-opacity="0" />
    </radialGradient>

    <!-- Ribbon & Facet Gradients -->
    <linearGradient id="tealGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <linearGradient id="tealGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="slatePillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134E4A" />
      <stop offset="50%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#021E1D" />
    </linearGradient>

    <linearGradient id="lightTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <filter id="glowFilter2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowPlate2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Container Plate -->
  <rect width="400" height="400" rx="64" fill="url(#bgGrad2)" />
  <rect width="398" height="398" x="1" y="1" rx="63" fill="none" stroke="#134E4A" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Ambient Light Center Glow -->
  <circle cx="200" cy="186" r="160" fill="url(#coreGlow2)" />

  <!-- Isometric Drafting Grid & Layout Marks -->
  <g opacity="0.16" stroke="#2DD4BF" stroke-width="0.75">
    <!-- Isometric Grid lines -->
    <line x1="80" y1="116" x2="320" y2="256" stroke-dasharray="2 4" />
    <line x1="80" y1="256" x2="320" y2="116" stroke-dasharray="2 4" />
    <line x1="200" y1="50" x2="200" y2="330" stroke-dasharray="3 5" />
    <line x1="70" y1="186" x2="330" y2="186" stroke-dasharray="3 5" />
    <!-- Outer bounds wireframe -->
    <polygon points="200,64 316,131 316,265 200,332 84,265 84,131" fill="none" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.6" />
  </g>

  <!-- Precision Corner Coordinate Indicators -->
  <g stroke="#14B8A6" stroke-width="1" opacity="0.4">
    <path d="M 64 80 L 64 64 L 80 64" fill="none" />
    <path d="M 336 80 L 336 64 L 320 64" fill="none" />
    <path d="M 64 320 L 64 336 L 80 336" fill="none" />
    <path d="M 336 320 L 336 336 L 320 336" fill="none" />
  </g>

  <!-- MAIN ABSTRACT ORTHOGONAL BRIDGE (Interlocking Spatial Viewport 'N' / 'M') -->
  <g filter="url(#shadowPlate2)">
    <!-- BACKDROP VIEWPORT FRAME (Web Mirror Plane - Inclinative) -->
    <polygon points="150,86 270,126 270,230 150,190" fill="url(#slatePillar)" stroke="#0D9488" stroke-opacity="0.4" stroke-width="1" />

    <!-- Isometric Viewport Cutout / Screen Portal -->
    <polygon points="164,106 256,136 256,214 164,184" fill="#021E1D" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="1" />

    <!-- INTERLOCKING STRUCTURAL RIBBONS (Forming dynamic 'N' / 'M' Bridge) -->
    <!-- Ribbon Segment 1: Left Vertical Column (Web Layout Anchor) -->
    <path d="M 104 140 L 148 116 L 148 274 L 104 250 Z" fill="url(#tealGrad1)" />
    <!-- Front Face Bevel of Left Column -->
    <path d="M 104 140 L 148 116 L 148 128 L 104 152 Z" fill="#99F6E4" opacity="0.8" />
    <line x1="148" y1="116" x2="148" y2="274" stroke="url(#lightTrim)" stroke-width="2" />

    <!-- Ribbon Segment 2: Right Vertical Column (Native Screen Anchor) -->
    <path d="M 252 116 L 296 140 L 296 250 L 252 274 Z" fill="url(#tealGrad2)" />
    <!-- Front Face Bevel of Right Column -->
    <path d="M 252 116 L 296 140 L 296 152 L 252 128 Z" fill="#99F6E4" opacity="0.8" />
    <line x1="252" y1="116" x2="252" y2="274" stroke="url(#lightTrim)" stroke-width="2" />

    <!-- Ribbon Segment 3: The Interlocking Cantilever Bridge (The Transverse Span) -->
    <!-- Floating Diagonal Span linking Column 1 to Column 2 across 3D space -->
    <g filter="url(#glowFilter2)">
      <!-- Top illuminated bridge facet -->
      <polygon points="148,154 200,126 252,154 200,182" fill="url(#tealGrad1)" />
      <!-- Lower beveled bridge facet (underside perspective) -->
      <polygon points="148,154 200,182 200,214 148,186" fill="url(#emeraldGrad)" />
      <polygon points="200,182 252,154 252,186 200,214" fill="#047857" />

      <!-- Center Keystone Vertex Jewel (Locking point) -->
      <polygon points="186,154 200,146 214,154 200,162" fill="#F0FDFA" />
      <circle cx="200" cy="154" r="2.5" fill="#14B8A6" />

      <!-- Perimeter Sharp Luminous Edges -->
      <line x1="148" y1="154" x2="200" y2="126" stroke="#F0FDFA" stroke-width="2.5" stroke-linecap="round" />
      <line x1="200" y1="126" x2="252" y2="154" stroke="#CCFBF1" stroke-width="2.5" stroke-linecap="round" />
      <line x1="200" y1="126" x2="200" y2="214" stroke="#F0FDFA" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Lower Foundation Strut / Layout Baseline -->
    <polygon points="148,244 200,272 252,244 200,216" fill="#042F2E" stroke="#14B8A6" stroke-opacity="0.5" stroke-width="1.5" />
    <line x1="200" y1="216" x2="200" y2="272" stroke="#5EEAD4" stroke-width="1.5" opacity="0.7" />

    <!-- Spatial Node Points -->
    <circle cx="104" cy="140" r="3.5" fill="#5EEAD4" />
    <circle cx="296" cy="140" r="3.5" fill="#5EEAD4" />
    <circle cx="148" cy="274" r="3.5" fill="#14B8A6" />
    <circle cx="252" cy="274" r="3.5" fill="#14B8A6" />
    <circle cx="200" cy="272" r="4" fill="#CCFBF1" />
  </g>

  <!-- Typography: Modern Geometric Wordmark Sub-label -->
  <text x="200" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#99F6E4">NATIVEMASON</text>
  <text x="200" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#2DD4BF" opacity="0.8">ORTHOGONAL NEXUS</text>
</svg>

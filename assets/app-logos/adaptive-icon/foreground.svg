<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="100%" height="100%">
  <defs>
    <linearGradient id="adpKeystone" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="adpHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="adpPylonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="adpPylonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="adpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="adpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Foreground Group: Centered in 432x432 (Center = 216, 216) -->
  <g transform="translate(216, 216) scale(0.72) translate(-256, -240)" filter="url(#adpShadow)">
    <!-- Left Pylon -->
    <path d="M 126 364 L 180 172 L 226 192 L 184 364 Z" fill="url(#adpPylonLeft)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 180 172 L 226 192 L 196 364 L 152 364 Z" fill="url(#adpPylonLeft)" opacity="0.85" />
    <path d="M 180 172 L 226 192" stroke="url(#adpHighlight)" stroke-width="3" stroke-linecap="round" />
    <line x1="226" y1="192" x2="196" y2="364" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="2" />

    <!-- Right Pylon -->
    <path d="M 386 364 L 332 172 L 286 192 L 328 364 Z" fill="url(#adpPylonRight)" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 332 172 L 286 192 L 316 364 L 360 364 Z" fill="url(#adpPylonRight)" opacity="0.95" />
    <path d="M 332 172 L 286 192" stroke="url(#adpHighlight)" stroke-width="3" stroke-linecap="round" />
    <line x1="286" y1="192" x2="316" y2="364" stroke="#818CF8" stroke-opacity="0.8" stroke-width="2" />

    <!-- Horizontal Bridge Tie-Beam -->
    <polygon points="174,288 338,288 326,318 186,318" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <line x1="190" y1="290" x2="322" y2="290" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="2" />

    <!-- Suspended Keystone -->
    <g filter="url(#adpGlow)">
      <polygon points="206,112 306,112 288,228 256,250 224,228" fill="url(#adpKeystone)" />
      <polygon points="206,112 256,112 256,250 224,228" fill="url(#adpHighlight)" />
      <polygon points="256,112 306,112 288,228 256,250" fill="url(#adpKeystone)" opacity="0.85" />
      <polygon points="206,112 306,112 296,124 216,124" fill="#E0F2FE" opacity="0.75" />
      <line x1="256" y1="112" x2="256" y2="250" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="206,112 306,112 288,228 256,250 224,228" fill="none" stroke="#BAE6FD" stroke-width="2" />
    </g>

    <!-- Laser Datum -->
    <line x1="256" y1="250" x2="256" y2="356" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.85" />
    <circle cx="256" cy="254" r="4.5" fill="#FFFFFF" />
    <circle cx="256" cy="304" r="3.5" fill="#38BDF8" />
    <circle cx="256" cy="356" r="4.5" fill="#818CF8" />

    <circle cx="185" cy="364" r="5" fill="#38BDF8" />
    <circle cx="327" cy="364" r="5" fill="#818CF8" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip6">
      <rect x="0" y="0" width="512" height="512" rx="115" />
    </clipPath>

    <!-- App Background: Pure Ceramic Pearl White -->
    <radialGradient id="appBg6" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <!-- Obsidian Ink Mark Gradients -->
    <linearGradient id="inkKeystone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="inkHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="inkPylonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="inkPylonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="appDropShadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Base Icon Plate -->
  <g clip-path="url(#squircleClip6)">
    <rect width="512" height="512" fill="url(#appBg6)" />

    <!-- Subtle Technical Layout Reticle -->
    <g opacity="0.3" stroke="#CBD5E1" stroke-width="1">
      <line x1="256" y1="40" x2="256" y2="472" stroke-dasharray="4 8" />
      <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="4 8" />
      <circle cx="256" cy="256" r="145" fill="none" stroke-dasharray="4 8" />
    </g>

    <!-- Corner Target Reticles -->
    <g stroke="#94A3B8" stroke-width="1.5" opacity="0.5">
      <path d="M 60 84 L 60 60 L 84 60" fill="none" />
      <path d="M 452 84 L 452 60 L 428 60" fill="none" />
      <path d="M 60 428 L 60 452 L 84 452" fill="none" />
      <path d="M 452 428 L 452 452 L 428 452" fill="none" />
    </g>

    <!-- MAIN EMBLEM (Obsidian Ink Mark with Royal Cyan Accent) -->
    <g filter="url(#appDropShadow6)">
      <!-- Left Pylon -->
      <path d="M 126 364 L 180 172 L 226 192 L 184 364 Z" fill="url(#inkPylonLeft)" />
      <path d="M 180 172 L 226 192 L 196 364 L 152 364 Z" fill="#0F172A" opacity="0.9" />
      <path d="M 180 172 L 226 192" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="226" y1="192" x2="196" y2="364" stroke="#0284C7" stroke-width="2" />

      <!-- Right Pylon -->
      <path d="M 386 364 L 332 172 L 286 192 L 328 364 Z" fill="url(#inkPylonRight)" />
      <path d="M 332 172 L 286 192 L 316 364 L 360 364 Z" fill="#1E293B" opacity="0.95" />
      <path d="M 332 172 L 286 192" stroke="#6366F1" stroke-width="3" stroke-linecap="round" />
      <line x1="286" y1="192" x2="316" y2="364" stroke="#4F46E5" stroke-width="2" />

      <!-- Tie-Beam -->
      <polygon points="174,288 338,288 326,318 186,318" fill="#0F172A" />
      <line x1="190" y1="290" x2="322" y2="290" stroke="#38BDF8" stroke-width="2" />

      <!-- The Suspended Keystone -->
      <polygon points="206,112 306,112 288,228 256,250 224,228" fill="url(#inkKeystone)" />
      <polygon points="206,112 256,112 256,250 224,228" fill="url(#inkHighlight)" />
      <polygon points="256,112 306,112 288,228 256,250" fill="url(#inkKeystone)" opacity="0.85" />
      <polygon points="206,112 306,112 296,124 216,124" fill="#E0F2FE" opacity="0.85" />
      <line x1="256" y1="112" x2="256" y2="250" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="206,112 306,112 288,228 256,250 224,228" fill="none" stroke="#0F172A" stroke-width="1.5" />

      <!-- Center Datum Line -->
      <line x1="256" y1="250" x2="256" y2="356" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5" opacity="0.8" />
      <circle cx="256" cy="254" r="4" fill="#0284C7" />
      <circle cx="256" cy="304" r="3" fill="#64748B" />
      <circle cx="256" cy="356" r="4" fill="#4F46E5" />

      <!-- Base Anchors -->
      <circle cx="185" cy="364" r="4.5" fill="#0284C7" />
      <circle cx="327" cy="364" r="4.5" fill="#4F46E5" />
    </g>
  </g>

  <!-- Squircle Border Stroke (Clean Editorial Rim) -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip4">
      <rect x="0" y="0" width="512" height="512" rx="115" />
    </clipPath>

    <!-- App Background -->
    <radialGradient id="appBg4" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1E1436" />
      <stop offset="55%" stop-color="#0E081C" />
      <stop offset="100%" stop-color="#05020B" />
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="appGlow4" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0E081C" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Sheen -->
    <linearGradient id="topSheen4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Facet Gradients -->
    <linearGradient id="violetWingLeft4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="violetWingRight4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <linearGradient id="fuchsiaLowerLeft4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="60%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <linearGradient id="fuchsiaLowerRight4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="50%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>

    <linearGradient id="prismCore4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE" />
      <stop offset="40%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="appGlowFilter4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="appDropShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Base Icon Plate -->
  <g clip-path="url(#squircleClip4)">
    <rect width="512" height="512" fill="url(#appBg4)" />

    <!-- Ambient Core Glow -->
    <circle cx="256" cy="240" r="210" fill="url(#appGlow4)" />

    <!-- Dynamic Diamond Guidelines -->
    <g opacity="0.18" stroke="#C084FC" stroke-width="1">
      <line x1="256" y1="50" x2="256" y2="440" stroke-dasharray="4 8" />
      <line x1="80" y1="240" x2="432" y2="240" stroke-dasharray="4 8" />
      <polygon points="256,76 410,240 256,404 102,240" fill="none" stroke-dasharray="4 8" opacity="0.6" />
      <circle cx="256" cy="240" r="150" fill="none" stroke-dasharray="2 5" />
    </g>

    <!-- Corner Target Ticks -->
    <g stroke="#C084FC" stroke-width="1.5" opacity="0.4">
      <path d="M 60 84 L 60 60 L 84 60" fill="none" />
      <path d="M 452 84 L 452 60 L 428 60" fill="none" />
      <path d="M 60 428 L 60 452 L 84 452" fill="none" />
      <path d="M 452 428 L 452 452 L 428 452" fill="none" />
    </g>

    <!-- MAIN EMBLEM (The Kinetic Apex: Trowel-Delta Diamond Glyph) -->
    <g filter="url(#appDropShadow4)">
      <!-- Upper Left Swept Wing -->
      <polygon points="256,96 132,240 202,240 256,176" fill="url(#violetWingLeft4)" />
      <line x1="256" y1="96" x2="132" y2="240" stroke="#DDD6FE" stroke-width="3" stroke-linecap="round" />
      <line x1="256" y1="96" x2="256" y2="176" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

      <!-- Upper Right Swept Wing -->
      <polygon points="256,96 380,240 310,240 256,176" fill="url(#violetWingRight4)" />
      <line x1="256" y1="96" x2="380" y2="240" stroke="#F3E8FF" stroke-width="3" stroke-linecap="round" />

      <!-- Lower Left Trailing Wing -->
      <polygon points="132,240 202,240 256,304 256,380" fill="url(#fuchsiaLowerLeft4)" />
      <line x1="132" y1="240" x2="256" y2="380" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" />

      <!-- Lower Right Trailing Wing -->
      <polygon points="380,240 310,240 256,304 256,380" fill="url(#fuchsiaLowerRight4)" />
      <line x1="380" y1="240" x2="256" y2="380" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />
      <line x1="256" y1="304" x2="256" y2="380" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

      <!-- Central Floating Prism Aperture -->
      <g filter="url(#appGlowFilter4)">
        <polygon points="256,188 296,240 256,292 216,240" fill="url(#prismCore4)" />
        <polygon points="256,188 216,240 256,292" fill="#FDF4FF" opacity="0.4" />
        <line x1="256" y1="188" x2="256" y2="292" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
        <polygon points="256,188 296,240 256,292 216,240" fill="none" stroke="#FFFFFF" stroke-width="2" />
      </g>

      <!-- Transverse Negative Connectors -->
      <line x1="202" y1="240" x2="216" y2="240" stroke="#E9D5FF" stroke-width="2.5" />
      <line x1="296" y1="240" x2="310" y2="240" stroke="#E9D5FF" stroke-width="2.5" />

      <!-- Kinetic Vertices -->
      <circle cx="256" cy="96" r="5" fill="#FFFFFF" />
      <circle cx="132" cy="240" r="4.5" fill="#DDD6FE" />
      <circle cx="380" cy="240" r="4.5" fill="#F3E8FF" />
      <circle cx="256" cy="380" r="5" fill="#EC4899" />
      <circle cx="256" cy="240" r="4" fill="#FFFFFF" />
    </g>

    <!-- Top Specular Sheen -->
    <rect width="512" height="230" fill="url(#topSheen4)" />
  </g>

  <!-- Squircle Border Stroke (Bezel Rim Light) -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1" />
</svg>

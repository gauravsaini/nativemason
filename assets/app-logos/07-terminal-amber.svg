<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip7">
      <rect x="0" y="0" width="512" height="512" rx="115" />
    </clipPath>

    <!-- CRT Dark Substrate -->
    <radialGradient id="appBg7" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1A1204" />
      <stop offset="55%" stop-color="#0B0802" />
      <stop offset="100%" stop-color="#030200" />
    </radialGradient>

    <!-- Phosphor Amber Bloom -->
    <radialGradient id="appGlow7" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0802" stop-opacity="0" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="512" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="512" y2="0" stroke="#000000" stroke-width="2.5" opacity="0.35" />
    </pattern>

    <!-- Amber Vector Gradients -->
    <linearGradient id="amberMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="amberPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#260F02" />
      <stop offset="100%" stop-color="#0C0501" />
    </linearGradient>

    <filter id="appGlowFilter7" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="appDropShadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Base Icon Plate -->
  <g clip-path="url(#squircleClip7)">
    <rect width="512" height="512" fill="url(#appBg7)" />

    <!-- Phosphor Bloom -->
    <circle cx="256" cy="240" r="210" fill="url(#appGlow7)" />

    <!-- CRT Wireframe Grid -->
    <g opacity="0.22" stroke="#FBBF24" stroke-width="1">
      <line x1="256" y1="40" x2="256" y2="472" stroke-dasharray="4 6" />
      <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="4 6" />
      <circle cx="256" cy="256" r="145" fill="none" stroke-dasharray="3 6" />
      <!-- Radial 45 deg ticks -->
      <line x1="140" y1="140" x2="372" y2="372" stroke-dasharray="2 4" />
      <line x1="140" y1="372" x2="372" y2="140" stroke-dasharray="2 4" />
    </g>

    <!-- Corner Reticles -->
    <g stroke="#FBBF24" stroke-width="1.5" opacity="0.45">
      <path d="M 60 84 L 60 60 L 84 60" fill="none" />
      <path d="M 452 84 L 452 60 L 428 60" fill="none" />
      <path d="M 60 428 L 60 452 L 84 452" fill="none" />
      <path d="M 452 428 L 452 452 L 428 452" fill="none" />
    </g>

    <!-- MAIN EMBLEM (Terminal Amber Wireframe Keystone) -->
    <g filter="url(#appDropShadow7)">
      <!-- Left Pylon -->
      <path d="M 126 364 L 180 172 L 226 192 L 184 364 Z" fill="url(#amberPillar)" stroke="#D97706" stroke-width="1.5" />
      <line x1="180" y1="172" x2="226" y2="192" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />
      <line x1="226" y1="192" x2="196" y2="364" stroke="#F59E0B" stroke-width="2" />

      <!-- Right Pylon -->
      <path d="M 386 364 L 332 172 L 286 192 L 328 364 Z" fill="url(#amberPillar)" stroke="#D97706" stroke-width="1.5" />
      <line x1="332" y1="172" x2="286" y2="192" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />
      <line x1="286" y1="192" x2="316" y2="364" stroke="#F59E0B" stroke-width="2" />

      <!-- Bridge Tie-Beam -->
      <polygon points="174,288 338,288 326,318 186,318" fill="#260F02" stroke="#78350F" stroke-width="1.5" />
      <line x1="190" y1="290" x2="322" y2="290" stroke="#F59E0B" stroke-width="2" />

      <!-- Glowing Phosphor Keystone -->
      <g filter="url(#appGlowFilter7)">
        <polygon points="206,112 306,112 288,228 256,250 224,228" fill="url(#amberMain)" />
        <line x1="256" y1="112" x2="256" y2="250" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
        <polygon points="206,112 306,112 288,228 256,250 224,228" fill="none" stroke="#FFFBEB" stroke-width="2" />
      </g>

      <!-- Datum & Vertices -->
      <line x1="256" y1="250" x2="256" y2="356" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="256" cy="254" r="4.5" fill="#FFFBEB" />
      <circle cx="256" cy="304" r="3.5" fill="#F59E0B" />
      <circle cx="256" cy="356" r="4.5" fill="#FBBF24" />

      <circle cx="185" cy="364" r="4.5" fill="#FBBF24" />
      <circle cx="327" cy="364" r="4.5" fill="#FBBF24" />
    </g>

    <!-- Scanline Overlay -->
    <rect width="512" height="512" fill="url(#scanlines)" />
  </g>

  <!-- Squircle Border Stroke (Phosphor Rim) -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#FDE68A" stroke-opacity="0.15" stroke-width="1" />
</svg>

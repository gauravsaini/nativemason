<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip1">
      <rect x="0" y="0" width="512" height="512" rx="115" />
    </clipPath>

    <!-- App Background -->
    <radialGradient id="appBg1" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="55%" stop-color="#0B101D" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="appGlow1" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B101D" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Sheen (Top glass reflection) -->
    <linearGradient id="topSheen1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Keystone Gradients -->
    <linearGradient id="keystoneMain1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="keystoneHighlight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Structural Pylon Gradients -->
    <linearGradient id="pylonLeft1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="pylonRight1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="appGlowFilter1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="appDropShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Base Icon Plate (Clipped to Squircle) -->
  <g clip-path="url(#squircleClip1)">
    <!-- Dark Space Canvas -->
    <rect width="512" height="512" fill="url(#appBg1)" />

    <!-- Ambient Core Glow -->
    <circle cx="256" cy="245" r="210" fill="url(#appGlow1)" />

    <!-- Subtle Technical Layout Reticle -->
    <g opacity="0.18" stroke="#38BDF8" stroke-width="1">
      <line x1="256" y1="40" x2="256" y2="472" stroke-dasharray="4 8" />
      <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="4 8" />
      <circle cx="256" cy="256" r="145" fill="none" stroke-dasharray="3 6" />
    </g>

    <!-- Corner Target Reticles -->
    <g stroke="#38BDF8" stroke-width="1.5" opacity="0.35">
      <path d="M 60 84 L 60 60 L 84 60" fill="none" />
      <path d="M 452 84 L 452 60 L 428 60" fill="none" />
      <path d="M 60 428 L 60 452 L 84 452" fill="none" />
      <path d="M 452 428 L 452 452 L 428 452" fill="none" />
    </g>

    <!-- MAIN EMBLEM (Quantum Keystone & Architectural Arch) -->
    <g filter="url(#appDropShadow1)">
      <!-- Left Pylon -->
      <path d="M 126 364 L 180 172 L 226 192 L 184 364 Z" fill="url(#pylonLeft1)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2" />
      <path d="M 180 172 L 226 192 L 196 364 L 152 364 Z" fill="url(#pylonLeft1)" opacity="0.85" />
      <path d="M 180 172 L 226 192" stroke="url(#keystoneHighlight1)" stroke-width="3" stroke-linecap="round" />
      <line x1="226" y1="192" x2="196" y2="364" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="2" />

      <!-- Right Pylon -->
      <path d="M 386 364 L 332 172 L 286 192 L 328 364 Z" fill="url(#pylonRight1)" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.2" />
      <path d="M 332 172 L 286 192 L 316 364 L 360 364 Z" fill="url(#pylonRight1)" opacity="0.95" />
      <path d="M 332 172 L 286 192" stroke="url(#keystoneHighlight1)" stroke-width="3" stroke-linecap="round" />
      <line x1="286" y1="192" x2="316" y2="364" stroke="#818CF8" stroke-opacity="0.8" stroke-width="2" />

      <!-- Horizontal Bridge Tie-Beam -->
      <polygon points="174,288 338,288 326,318 186,318" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <line x1="190" y1="290" x2="322" y2="290" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="2" />

      <!-- The Suspended Quantum Keystone -->
      <g filter="url(#appGlowFilter1)">
        <polygon points="206,112 306,112 288,228 256,250 224,228" fill="url(#keystoneMain1)" />
        <polygon points="206,112 256,112 256,250 224,228" fill="url(#keystoneHighlight1)" />
        <polygon points="256,112 306,112 288,228 256,250" fill="url(#keystoneMain1)" opacity="0.85" />
        <polygon points="206,112 306,112 296,124 216,124" fill="#E0F2FE" opacity="0.75" />
        <line x1="256" y1="112" x2="256" y2="250" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
        <polygon points="206,112 306,112 288,228 256,250 224,228" fill="none" stroke="#BAE6FD" stroke-width="2" />
      </g>

      <!-- Laser Alignment Datum -->
      <line x1="256" y1="250" x2="256" y2="356" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.85" />
      <circle cx="256" cy="254" r="4.5" fill="#FFFFFF" />
      <circle cx="256" cy="304" r="3.5" fill="#38BDF8" />
      <circle cx="256" cy="356" r="4.5" fill="#818CF8" />

      <!-- Base Pylon Anchors -->
      <circle cx="185" cy="364" r="5" fill="#38BDF8" />
      <circle cx="327" cy="364" r="5" fill="#818CF8" />
    </g>

    <!-- Top Specular Glass Reflection Sheen -->
    <rect width="512" height="230" fill="url(#topSheen1)" />
  </g>

  <!-- Squircle Border Stroke (Bezel Rim Light) -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" />
</svg>

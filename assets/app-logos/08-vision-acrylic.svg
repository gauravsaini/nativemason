<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip8">
      <rect x="0" y="0" width="512" height="512" rx="115" />
    </clipPath>

    <!-- Dynamic Aurora Mesh Background -->
    <linearGradient id="auroraMesh8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="35%" stop-color="#0F766E" />
      <stop offset="70%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <radialGradient id="meshOrb1" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshOrb2" cx="75%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Frosted Acrylic Plate Gradient -->
    <linearGradient id="acrylicPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>

    <filter id="appDropShadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Icon Plate -->
  <g clip-path="url(#squircleClip8)">
    <rect width="512" height="512" fill="url(#auroraMesh8)" />
    <!-- Aurora Orbs -->
    <circle cx="150" cy="130" r="260" fill="url(#meshOrb1)" />
    <circle cx="380" cy="360" r="260" fill="url(#meshOrb2)" />

    <!-- Frosted Glass Central Floating Island -->
    <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#acrylicPlate)" filter="url(#appDropShadow8)" />
    <rect x="57" y="57" width="398" height="398" rx="89" fill="none" stroke="url(#glassRim)" stroke-width="1.5" />

    <!-- MAIN EMBLEM (Pure Sculpted Crystal Keystone) -->
    <g>
      <!-- Left Pylon -->
      <path d="M 146 348 L 194 176 L 234 194 L 198 348 Z" fill="#0F172A" opacity="0.6" />
      <path d="M 194 176 L 234 194 L 208 348 L 168 348 Z" fill="#FFFFFF" opacity="0.85" />
      <line x1="194" y1="176" x2="234" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="234" y1="194" x2="208" y2="348" stroke="#38BDF8" stroke-width="2.5" />

      <!-- Right Pylon -->
      <path d="M 366 348 L 318 176 L 278 194 L 314 348 Z" fill="#0F172A" opacity="0.6" />
      <path d="M 318 176 L 278 194 L 304 348 L 344 348 Z" fill="#FFFFFF" opacity="0.95" />
      <line x1="318" y1="176" x2="278" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="278" y1="194" x2="304" y2="348" stroke="#C084FC" stroke-width="2.5" />

      <!-- Floating Bridge Component -->
      <polygon points="186,280 326,280 316,306 196,306" fill="#0F172A" opacity="0.5" />
      <line x1="200" y1="282" x2="312" y2="282" stroke="#FFFFFF" stroke-width="2" />

      <!-- Central Pure Optical Keystone -->
      <polygon points="214,122 298,122 284,222 256,242 228,222" fill="#FFFFFF" opacity="0.9" />
      <polygon points="214,122 256,122 256,242 228,222" fill="#BAE6FD" opacity="0.9" />
      <polygon points="256,122 298,122 284,222 256,242" fill="#E0E7FF" opacity="0.75" />
      <polygon points="214,122 298,122 290,132 222,132" fill="#FFFFFF" />
      <line x1="256" y1="122" x2="256" y2="242" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="214,122 298,122 284,222 256,242 228,222" fill="none" stroke="#FFFFFF" stroke-width="2" />

      <!-- Center Datum Coordinates -->
      <line x1="256" y1="242" x2="256" y2="340" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
      <circle cx="256" cy="244" r="4.5" fill="#FFFFFF" />
      <circle cx="256" cy="292" r="3.5" fill="#38BDF8" />
      <circle cx="256" cy="340" r="4.5" fill="#C084FC" />

      <circle cx="196" cy="348" r="4.5" fill="#38BDF8" />
      <circle cx="316" cy="348" r="4.5" fill="#C084FC" />
    </g>

    <!-- Diagonal Glass Glare Sweep -->
    <polygon points="56,240 220,56 270,56 106,240" fill="#FFFFFF" opacity="0.12" />
  </g>

  <!-- Outer Squircle Bezel -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" />
</svg>

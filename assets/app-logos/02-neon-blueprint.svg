<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip2">
      <rect x="0" y="0" width="512" height="512" rx="115" />
    </clipPath>

    <!-- App Background -->
    <radialGradient id="appBg2" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#042F2C" />
      <stop offset="55%" stop-color="#021A18" />
      <stop offset="100%" stop-color="#010A09" />
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="appGlow2" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#021A18" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Sheen -->
    <linearGradient id="topSheen2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ribbon & Facet Gradients -->
    <linearGradient id="mintGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <linearGradient id="mintGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="emeraldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="appGlowFilter2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="appDropShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Icon Plate -->
  <g clip-path="url(#squircleClip2)">
    <rect width="512" height="512" fill="url(#appBg2)" />

    <!-- Ambient Glow -->
    <circle cx="256" cy="240" r="210" fill="url(#appGlow2)" />

    <!-- Isometric Technical Grid -->
    <g opacity="0.18" stroke="#2DD4BF" stroke-width="1">
      <line x1="100" y1="150" x2="412" y2="330" stroke-dasharray="3 6" />
      <line x1="100" y1="330" x2="412" y2="150" stroke-dasharray="3 6" />
      <line x1="256" y1="50" x2="256" y2="440" stroke-dasharray="4 8" />
      <line x1="80" y1="240" x2="432" y2="240" stroke-dasharray="4 8" />
      <polygon points="256,80 405,166 405,338 256,424 107,338 107,166" fill="none" stroke-width="1" stroke-dasharray="4 8" opacity="0.6" />
    </g>

    <!-- Corner Target Ticks -->
    <g stroke="#14B8A6" stroke-width="1.5" opacity="0.4">
      <path d="M 60 84 L 60 60 L 84 60" fill="none" />
      <path d="M 452 84 L 452 60 L 428 60" fill="none" />
      <path d="M 60 428 L 60 452 L 84 452" fill="none" />
      <path d="M 452 428 L 452 452 L 428 452" fill="none" />
    </g>

    <!-- MAIN EMBLEM (Orthogonal Viewport Bridge 'N' / 'M') -->
    <g filter="url(#appDropShadow2)">
      <!-- Backdrop Web Viewport Plate -->
      <polygon points="190,110 346,162 346,298 190,246" fill="#04201E" stroke="#0D9488" stroke-opacity="0.45" stroke-width="1.5" />
      <polygon points="208,136 328,176 328,276 208,236" fill="#021413" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="1" />

      <!-- Left Column (Web layout pylon) -->
      <path d="M 132 180 L 190 148 L 190 354 L 132 322 Z" fill="url(#mintGrad1)" />
      <path d="M 132 180 L 190 148 L 190 164 L 132 196 Z" fill="#CCFBF1" opacity="0.8" />
      <line x1="190" y1="148" x2="190" y2="354" stroke="#CCFBF1" stroke-width="2.5" />

      <!-- Right Column (Native screen pylon) -->
      <path d="M 322 148 L 380 180 L 380 322 L 322 354 Z" fill="url(#mintGrad2)" />
      <path d="M 322 148 L 380 180 L 380 196 L 322 164 Z" fill="#CCFBF1" opacity="0.8" />
      <line x1="322" y1="148" x2="322" y2="354" stroke="#CCFBF1" stroke-width="2.5" />

      <!-- Cantilevered Interlocking Bridge Ribbon -->
      <g filter="url(#appGlowFilter2)">
        <polygon points="190,198 256,162 322,198 256,234" fill="url(#mintGrad1)" />
        <polygon points="190,198 256,234 256,276 190,240" fill="url(#emeraldFacet)" />
        <polygon points="256,234 322,198 322,240 256,276" fill="#047857" />

        <!-- Floating Central Keystone Jewel -->
        <polygon points="238,198 256,188 274,198 256,208" fill="#F0FDFA" />
        <circle cx="256" cy="198" r="3.5" fill="#14B8A6" />

        <!-- Sharp Luminous Vector Edges -->
        <line x1="190" y1="198" x2="256" y2="162" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
        <line x1="256" y1="162" x2="322" y2="198" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round" />
        <line x1="256" y1="162" x2="256" y2="276" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      </g>

      <!-- Foundation Strut -->
      <polygon points="190,314 256,350 322,314 256,278" fill="#042F2C" stroke="#14B8A6" stroke-opacity="0.6" stroke-width="2" />
      <line x1="256" y1="278" x2="256" y2="350" stroke="#5EEAD4" stroke-width="2" />

      <!-- Spatial Node Points -->
      <circle cx="132" cy="180" r="4.5" fill="#5EEAD4" />
      <circle cx="380" cy="180" r="4.5" fill="#5EEAD4" />
      <circle cx="190" cy="354" r="4.5" fill="#14B8A6" />
      <circle cx="322" cy="354" r="4.5" fill="#14B8A6" />
      <circle cx="256" cy="350" r="5" fill="#CCFBF1" />
    </g>

    <!-- Top Specular Sheen -->
    <rect width="512" height="230" fill="url(#topSheen2)" />
  </g>

  <!-- Squircle Border Stroke (Bezel Rim Light) -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="1" />
</svg>

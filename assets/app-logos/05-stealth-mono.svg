<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Squircle Clip Path -->
    <clipPath id="squircleClip5">
      <rect x="0" y="0" width="512" height="512" rx="115" />
    </clipPath>

    <!-- App Background: Deep Matte Carbon -->
    <radialGradient id="appBg5" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="55%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Specular Sheen -->
    <linearGradient id="topSheen5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Monochrome Keystone Gradients -->
    <linearGradient id="monoKeystone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D4D4D8" />
      <stop offset="100%" stop-color="#71717A" />
    </linearGradient>

    <linearGradient id="monoHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <linearGradient id="monoPylonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="monoPylonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <filter id="appDropShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Icon Plate -->
  <g clip-path="url(#squircleClip5)">
    <rect width="512" height="512" fill="url(#appBg5)" />

    <!-- Pure Subtle Geometric Grid -->
    <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
      <line x1="256" y1="40" x2="256" y2="472" stroke-dasharray="4 8" />
      <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="4 8" />
      <circle cx="256" cy="256" r="145" fill="none" stroke-dasharray="4 8" />
    </g>

    <!-- Corner Reticles -->
    <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.25">
      <path d="M 60 84 L 60 60 L 84 60" fill="none" />
      <path d="M 452 84 L 452 60 L 428 60" fill="none" />
      <path d="M 60 428 L 60 452 L 84 452" fill="none" />
      <path d="M 452 428 L 452 452 L 428 452" fill="none" />
    </g>

    <!-- MAIN EMBLEM (High-Contrast Stealth Keystone Arch) -->
    <g filter="url(#appDropShadow5)">
      <!-- Left Pylon -->
      <path d="M 126 364 L 180 172 L 226 192 L 184 364 Z" fill="url(#monoPylonLeft)" stroke="#52525B" stroke-opacity="0.5" stroke-width="1.2" />
      <path d="M 180 172 L 226 192 L 196 364 L 152 364 Z" fill="url(#monoPylonLeft)" opacity="0.9" />
      <path d="M 180 172 L 226 192" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="226" y1="192" x2="196" y2="364" stroke="#71717A" stroke-width="2" />

      <!-- Right Pylon -->
      <path d="M 386 364 L 332 172 L 286 192 L 328 364 Z" fill="url(#monoPylonRight)" stroke="#52525B" stroke-opacity="0.5" stroke-width="1.2" />
      <path d="M 332 172 L 286 192 L 316 364 L 360 364 Z" fill="url(#monoPylonRight)" opacity="0.95" />
      <path d="M 332 172 L 286 192" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="286" y1="192" x2="316" y2="364" stroke="#A1A1AA" stroke-width="2" />

      <!-- Tie-Beam -->
      <polygon points="174,288 338,288 326,318 186,318" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <line x1="190" y1="290" x2="322" y2="290" stroke="#71717A" stroke-width="2" />

      <!-- The Suspended Keystone -->
      <polygon points="206,112 306,112 288,228 256,250 224,228" fill="url(#monoKeystone)" />
      <polygon points="206,112 256,112 256,250 224,228" fill="url(#monoHighlight)" />
      <polygon points="256,112 306,112 288,228 256,250" fill="url(#monoKeystone)" opacity="0.85" />
      <polygon points="206,112 306,112 296,124 216,124" fill="#FFFFFF" opacity="0.85" />
      <line x1="256" y1="112" x2="256" y2="250" stroke="#000000" stroke-width="2" stroke-linecap="round" opacity="0.4" />
      <polygon points="206,112 306,112 288,228 256,250 224,228" fill="none" stroke="#FFFFFF" stroke-width="2" />

      <!-- Center Datum Line -->
      <line x1="256" y1="250" x2="256" y2="356" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 5" opacity="0.6" />
      <circle cx="256" cy="254" r="4" fill="#FFFFFF" />
      <circle cx="256" cy="304" r="3" fill="#A1A1AA" />
      <circle cx="256" cy="356" r="4" fill="#FFFFFF" />

      <!-- Base Anchors -->
      <circle cx="185" cy="364" r="4.5" fill="#E4E4E7" />
      <circle cx="327" cy="364" r="4.5" fill="#E4E4E7" />
    </g>

    <!-- Top Specular Sheen -->
    <rect width="512" height="230" fill="url(#topSheen5)" />
  </g>

  <!-- Squircle Border Stroke -->
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#27272A" stroke-width="1" />
</svg>

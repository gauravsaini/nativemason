name: NativeMason acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      evidence_url: ${{ steps.web-evidence.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn playwright install --with-deps chromium
      - run: yarn test
      - run: yarn test:integration
      - run: yarn test:packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: web-evidence
        if: always()
        with:
          name: web-and-package-evidence
          path: artifacts/
          if-no-files-found: warn
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      evidence_url: ${{ steps.android-evidence.outputs.artifact-url }}
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_LAYOUT_NATIVE_TOKEN: nativemason-ci-android-pairing-token
      EXPO_PUBLIC_LAYOUT_NATIVE_URL: ws://127.0.0.1:19482
      EXPO_PUBLIC_LAYOUT_SCENARIO: broken-footer
      EXPO_PUBLIC_LAYOUT_TARGET_ID: emulator-5554
      EXPO_PUBLIC_LAYOUT_TARGET_KIND: emulator
      ADB_SERIAL: emulator-5554
      NM_ANDROID_PACKAGE: dev.rnlayout.fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable && yarn build
      - run: yarn playwright install --with-deps chromium
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate Android debug project
        working-directory: examples/expo-fixture
        run: yarn expo prebuild --platform android --no-install
      - name: Build native debug fixture
        working-directory: examples/expo-fixture/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Run real Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p artifacts/android-emulator-acceptance
            adb -s "$ADB_SERIAL" install -r examples/expo-fixture/android/app/build/outputs/apk/debug/app-debug.apk
            CI=false yarn workspace @nativemason/expo-fixture web > artifacts/android-emulator-acceptance/metro.log 2>&1 &
            node scripts/wait-for-metro.mjs
            yarn test:e2e:android:emulator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: android-evidence
        if: always()
        with:
          name: android-emulator-evidence
          path: artifacts/android-emulator-acceptance/
          if-no-files-found: warn
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      evidence_url: ${{ steps.ios-evidence.outputs.artifact-url }}
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_LAYOUT_NATIVE_TOKEN: nativemason-ci-ios-pairing-token
      EXPO_PUBLIC_LAYOUT_NATIVE_URL: ws://127.0.0.1:19482
      EXPO_PUBLIC_LAYOUT_SCENARIO: broken-footer
      EXPO_PUBLIC_LAYOUT_TARGET_KIND: simulator
      NM_IOS_BUNDLE_ID: dev.nativemason.fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable && yarn build
      - run: yarn playwright install chromium
      - name: Initialize Expo CLI cache directory
        run: mkdir -p "$HOME/.expo"
      - name: Select and boot an available iOS phone simulator
        run: node scripts/select-ios-simulator.mjs
      - name: Build and install native debug fixture
        working-directory: examples/expo-fixture
        run: yarn expo run:ios --device "$IOS_SIMULATOR_UDID" --no-bundler
      - name: Run real iOS simulator acceptance
        run: |
          mkdir -p artifacts/ios-simulator-acceptance
          xcodebuild -version > artifacts/ios-simulator-acceptance/xcode.txt
          xcrun simctl list devices booted --json > artifacts/ios-simulator-acceptance/simulator.json
          CI=false yarn workspace @nativemason/expo-fixture web > artifacts/ios-simulator-acceptance/metro.log 2>&1 &
          node scripts/wait-for-metro.mjs
          yarn test:e2e:ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: ios-evidence
        if: always()
        with:
          name: ios-simulator-evidence
          path: artifacts/ios-simulator-acceptance/
          if-no-files-found: warn
  visual-evidence-report:
    needs: [checks, android-emulator, ios-simulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        continue-on-error: true
        with:
          name: web-and-package-evidence
          path: artifacts/report-input/web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        continue-on-error: true
        with:
          name: android-emulator-evidence
          path: artifacts/report-input/android
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        continue-on-error: true
        with:
          name: ios-simulator-evidence
          path: artifacts/report-input/ios
      - name: Build validated visual evidence report
        if: always()
        run: |
          yarn workspace @nativemason/contracts build
          yarn tsx scripts/build-evidence-report.ts \
            --web artifacts/report-input/web/integration/visual-evidence.json \
            --android artifacts/report-input/android \
            --ios artifacts/report-input/ios \
            --out artifacts/visual-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: visual-report
        if: always()
        with:
          name: visual-evidence-report-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts/visual-evidence/
          if-no-files-found: warn
      - name: Link evidence artifacts in pull request summary
        if: github.event_name == 'pull_request'
        env:
          WEB_EVIDENCE_URL: ${{ needs.checks.outputs.evidence_url }}
          ANDROID_EVIDENCE_URL: ${{ needs['android-emulator'].outputs.evidence_url }}
          IOS_EVIDENCE_URL: ${{ needs['ios-simulator'].outputs.evidence_url }}
          REPORT_URL: ${{ steps.visual-report.outputs.artifact-url }}
        run: |
          web_link='unavailable'
          android_link='unavailable'
          ios_link='unavailable'
          report_link='unavailable'
          if [ -n "$WEB_EVIDENCE_URL" ]; then web_link="[run artifact]($WEB_EVIDENCE_URL)"; fi
          if [ -n "$ANDROID_EVIDENCE_URL" ]; then android_link="[run artifact]($ANDROID_EVIDENCE_URL)"; fi
          if [ -n "$IOS_EVIDENCE_URL" ]; then ios_link="[run artifact]($IOS_EVIDENCE_URL)"; fi
          if [ -n "$REPORT_URL" ]; then report_link="[report artifact]($REPORT_URL)"; fi
          {
            echo '## Visual evidence artifacts'
            echo '| Target | Raw run evidence | HTML and JSON report |'
            echo '| --- | --- | --- |'
            printf '| Web | %s | %s |\n' "$web_link" "$report_link"
            printf '| Android emulator | %s | %s |\n' "$android_link" "$report_link"
            printf '| iOS simulator | %s | %s |\n' "$ios_link" "$report_link"
            echo
            echo 'Download the report artifact and open `index.html` locally; `manifest.json` contains the validated evidence.'
          } >> "$GITHUB_STEP_SUMMARY"

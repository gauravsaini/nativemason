name: NativeMason acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn playwright install --with-deps chromium
      - run: yarn test
      - run: yarn test:integration
      - run: yarn test:packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-and-package-evidence
          path: artifacts/
          if-no-files-found: warn
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_LAYOUT_NATIVE_TOKEN: nativemason-ci-android-pairing-token
      EXPO_PUBLIC_LAYOUT_NATIVE_URL: ws://127.0.0.1:19482
      EXPO_PUBLIC_LAYOUT_SCENARIO: broken-footer
      EXPO_PUBLIC_LAYOUT_TARGET_ID: emulator-5554
      EXPO_PUBLIC_LAYOUT_TARGET_KIND: emulator
      ADB_SERIAL: emulator-5554
      NM_ANDROID_PACKAGE: dev.rnlayout.fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable && yarn build
      - run: yarn playwright install --with-deps chromium
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate Android debug project
        working-directory: examples/expo-fixture
        run: yarn expo prebuild --platform android --no-install
      - name: Build native debug fixture
        working-directory: examples/expo-fixture/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Run real Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p artifacts/android-emulator-acceptance
            adb -s "$ADB_SERIAL" install -r examples/expo-fixture/android/app/build/outputs/apk/debug/app-debug.apk
            CI= yarn workspace @nativemason/expo-fixture web > artifacts/android-emulator-acceptance/metro.log 2>&1 &
            node scripts/wait-for-metro.mjs
            yarn test:e2e:android:emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: artifacts/android-emulator-acceptance/
          if-no-files-found: warn
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_LAYOUT_NATIVE_TOKEN: nativemason-ci-ios-pairing-token
      EXPO_PUBLIC_LAYOUT_NATIVE_URL: ws://127.0.0.1:19482
      EXPO_PUBLIC_LAYOUT_SCENARIO: broken-footer
      EXPO_PUBLIC_LAYOUT_TARGET_KIND: simulator
      NM_IOS_BUNDLE_ID: dev.nativemason.fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable && yarn build
      - run: yarn playwright install chromium
      - name: Initialize Expo CLI cache directory
        run: mkdir -p "$HOME/.expo"
      - name: Select and boot an available iOS phone simulator
        run: node scripts/select-ios-simulator.mjs
      - name: Build and install native debug fixture
        working-directory: examples/expo-fixture
        run: yarn expo run:ios --device "$IOS_SIMULATOR_UDID" --no-bundler
      - name: Run real iOS simulator acceptance
        run: |
          mkdir -p artifacts/ios-simulator-acceptance
          xcodebuild -version > artifacts/ios-simulator-acceptance/xcode.txt
          xcrun simctl list devices booted --json > artifacts/ios-simulator-acceptance/simulator.json
          CI= yarn workspace @nativemason/expo-fixture web > artifacts/ios-simulator-acceptance/metro.log 2>&1 &
          node scripts/wait-for-metro.mjs
          yarn test:e2e:ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence
          path: artifacts/ios-simulator-acceptance/
          if-no-files-found: warn
